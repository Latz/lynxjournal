# Vulnerability scanning includes dev/test dependencies (package.json
# devDependencies: build tooling, e2e/test frameworks like wp-playground,
# lighthouse, vite, vitest). None of this ships in the distributed plugin
# (see .distignore), but it's still real supply-chain exposure for anyone
# running the dev toolchain, so it's in scope here.
# Note: --include-dev-deps only supports npm/yarn/gradle in Trivy, not
# composer — composer.json's require-dev packages are scanned regardless
# (Trivy has no prod/dev split for composer.lock).
pkg:
  include-dev-deps: true

scan:
  scanners:
    - vuln
    - secret
    - misconfig
  skip-dirs:
    - vendor
    - node_modules
    - dist
    - build
    - svn
    - test-results
    - .scannerwork

severity:
  - HIGH
  - CRITICAL

exit-code: 1
